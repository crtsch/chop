<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHOP</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="home.css">
</head>
<body>
    <div id="content">
        <div id="header">
            <div id="menu">
                <div id="logo">
                    <a href="/">
                        <img src="assets/logo/logo_rose.png" alt="Logo">
                    </a>
                </div>
                <div id="recherche">
                    <input type="text" id="recherche-input" placeholder="Rechercher">
                </div>
                <div id="ajouter-btn">
                    <img src="assets/plus.svg" alt="Nouvelle recette">
                </div>
            </div>
            <div id="filters">
                <div class="filter" id="filter-type">Type v</div>
                <div class="filter" id="filter-prix">Prix v</div>
                <div class="filter" id="filter-duree">Durée v</div>
                <div class="filter" id="filter-ingredients">Ingrédients v</div>
                <div class="filter" id="filter-note">Note v</div>
            </div>
        </div>




        <div id="footer">
            <p id="footer-gauche">&copy; C. Ruetsch</p>
            <div id="footer-centre">
                <img src="assets/logo/logo_blanc.png">
            </div>
            <div id="footer-droite">
                <p>Mode sombre</p>
            </div>
        </div>
    </div>
</body>
</html>
