<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste de recettes | CHOP</title>

    <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.25/dist/lenis.css">
    <link rel="stylesheet" href="/style/global.css">
    <link rel="stylesheet" href="/style/home.css">
    <link rel="stylesheet" href="/style/dark-global.css">
    <link rel="stylesheet" href="/style/dark-home.css">
    <link rel="icon" type="image/png" href="/assets/logo/logo_fond_o.png">
</head>
<body>

    <div id="content">

        <div id="header">
            <div id="menu">
                <div id="logo">
                    <a href="/">
                        <img src="assets/logo/logo_rose.png" alt="Logo">
                    </a>
                </div>
                <div id="recherche">
                    <input type="text" id="recherche-input" placeholder="Rechercher">
                    <button id="recherche-btn">
                        <img src="assets/icones/loupe.svg" alt="🔍">
                    </button>
                </div>
                <div id="ajouter-btn">
                    <img src="assets/icones/plus.svg" alt="Nouvelle recette">
                </div>
            </div>

            <div id="filters">

                <div class="filter" id="filter-authors">
                    <button class="dropdown-btn" aria-expanded="false">
                        <span class="dropdown-btn-text">Auteurs</span>
                        <span class="dropdown-btn-arrow"></span>
                    </button>
                    <ul id="authors-select" class="dropdown-select hidden checkbox-list">
                        <li class="default-option selected">Tous les auteurs</li>
                    </ul>
                </div>
                
                <div class="filter" id="filter-category">
                    <button class="dropdown-btn" aria-expanded="false">
                        <span class="dropdown-btn-text">Catégorie</span>
                        <span class="dropdown-btn-arrow"></span>
                    </button>
                    <ul id="category-select" class="dropdown-select hidden">
                        <li class="default-option selected">Toutes</li>
                        <li>Entrées</li>
                        <li>Plats</li>
                        <li>Desserts</li>
                        <li>Autres</li>
                    </ul>
                </div>

                <div class="filter" id="filter-rating">
                    <button class="dropdown-btn" aria-expanded="false">
                        <span class="dropdown-btn-text">Note min.</span>
                        <span class="dropdown-btn-arrow"></span>
                    </button>
                    <div class="dropdown-select hidden rating-dropdown">
                        <div id="note-select" class="rating-container">
                            <input type="range" id="rating-range" min="0" max="5" step="1" value="0">
                            <span id="rating-value">Toutes les notes</span>
                        </div>
                    </div>
                </div>

                <div class="filter" id="filter-preptime">
                    <button class="dropdown-btn" aria-expanded="false">
                        <span class="dropdown-btn-text">Temps de prep. max.</span>
                        <span class="dropdown-btn-arrow"></span>
                    </button>
                    <div class="dropdown-select hidden preptime-dropdown">
                        <div id="note-select" class="preptime-container">
                            <input type="range" id="preptime-range" min="0" max="5" step="1" value="0">
                            <span id="preptime-value">Toutes durées</span>
                        </div>
                    </div>
                </div>

                <div class="filter" id="filter-maxprice">
                    <button class="dropdown-btn" aria-expanded="false">
                        <span class="dropdown-btn-text">Prix max.</span>
                        <span class="dropdown-btn-arrow"></span>
                    </button>
                    <div class="dropdown-select hidden maxprice-dropdown">
                        <div id="note-select" class="maxprice-container">
                            <input type="range" id="maxprice-range" min="0" max="5" step="1" value="0">
                            <span id="maxprice-value">Tous les prix</span>
                        </div>
                    </div>
                </div>

                <div class="filter" id="filter-ingredients">
                    <button class="dropdown-btn" aria-expanded="false">
                        <span class="dropdown-btn-text">Ingrédients</span>
                        <span class="dropdown-btn-arrow"></span>
                    </button>
                    <ul id="ingredients-select" class="dropdown-select hidden checkbox-list">
                        <li class="default-option selected">Tous les ingrédients</li>
                        <li id="ing-search-li"><input id="ing-search" type="text" placeholder="Rechercher"></li>
                    </ul>
                </div>

                <div class="filter" id="filter-difficulty">
                    <button class="dropdown-btn" aria-expanded="false">
                        <span class="dropdown-btn-text">Difficulté</span>
                        <span class="dropdown-btn-arrow"></span>
                    </button>
                    <ul id="difficulty-select" class="dropdown-select hidden">
                        <li class="default-option selected">Toutes</li>
                        <li>Facile</li>
                        <li>Moyen</li>
                        <li>Difficile</li>
                    </ul>
                </div>

            </div>

        </div>


        <div id="liste"></div>


        <div id="footer">
            <p id="footer-gauche">&copy; C. Ruetsch</p>
            <div id="footer-centre">
                <img src="assets/logo/logo_blanc.png">
            </div>
            <div id="footer-droite">
                <p><a href="todo">ToDo</a> / <span id="darkmode">Dark Mode</span></p>
            </div>
        </div>

    </div>

    <script src="/script/home.js"></script>
    <script src="/script/darkmode.js"></script>

    <script src="https://unpkg.com/lenis@1.3.25/dist/lenis.min.js"></script> 
    <script>new Lenis({ autoRaf: true, autoToggle: true, anchors: true, allowNestedScroll: true, naiveDimensions: true, stopInertiaOnNavigate: true })</script>

</body>
</html>
