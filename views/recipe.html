<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recette | CHOP</title>
    
    <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.25/dist/lenis.css">
    <link rel="stylesheet" href="/style/global.css">
    <link rel="stylesheet" href="/style/recipe.css">
    <link rel="stylesheet" href="/style/dark-global.css">
    <link rel="stylesheet" href="/style/dark-recipe.css">
    <link rel="icon" type="image/png" href="/assets/logo/logo_fond_o.png">

</head>
<body>
    
    <div id="content">

        <div id="header">
            <div id="menu">
                <div id="logo">
                    <a href="/">
                        <img src="assets/logo/logo_rose.png" alt="Logo">
                    </a>
                </div>
                <div id="recherche">
                    <input type="text" id="recherche-input" placeholder="Rechercher">
                    <button id="recherche-btn">
                        <img src="assets/icones/loupe.svg" alt="🔍">
                    </button>
                </div>
                <div id="ajouter-btn">
                    <img src="assets/icones/plus.svg" alt="Nouvelle recette">
                </div>
            </div>
        </div>





        <div id="image">
            <div id="image-texte">
                <h1></h1>
                <p id="auteur"></p>
            </div>
        </div>

        <div id="description">
            <p id="description-texte"></p>
        </div>

        <div id="infos">
        </div>

        <div id="imprimer-partager">
            <button id="imprimer-btn" onclick="window.print()">Imprimer</button>
            <button id="partager-btn">Partager</button>
        </div>
        
        <div id="share-modal-container">
            <div id="share-modal" class="modal">
                <div id="modal-content">
                    <button id="close-btn" aria-label="Fermer le popup" type="button">
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path d="M6 6L18 18" />
                            <path d="M18 6L6 18" />
                        </svg>
                    </button>
                    <h3>Partager cette recette</h3>
                    <div id="social-btns">
                        <button id="mail-btn" class="social-btn">E-mail</button>
                        <button id="whatsapp-btn" class="social-btn">WhatsApp</button>
                        <button id="pinterest-btn" class="social-btn">Pinterest</button>
                    </div>
                    <div id="share-link">
                        <input type="text" id="share-url" readonly>
                        <button id="share-url-btn">Copier</button>
                    </div>
                </div>
            </div>
        </div>

        <h2>Ingrédients</h2>
        
        <div id="quantity-selector">
            <button id="quantity-moins">–</button>
            <p id="quantity-val"></p>
            <button id="quantity-plus">+</button>
        </div>

        <div id="ingredients">
        </div>

        <h2>Recette</h2>

        <div id="etapes">
        </div>




        <div id="footer">
            <p id="footer-gauche">&copy; C. Ruetsch</p>
            <div id="footer-centre">
                <img src="assets/logo/logo_blanc.png">
            </div>
            <div id="footer-droite">
                <p><a href="todo">ToDo</a> / <span id="darkmode">Dark Mode</span></p>
            </div>
        </div>
        
    </div>

    <script src="/script/recipe.js"></script>
    <script src="/script/darkmode.js"></script>

    <script src="https://unpkg.com/lenis@1.3.25/dist/lenis.min.js"></script> 
    <script>new Lenis({ autoRaf: true, autoToggle: true, anchors: true, allowNestedScroll: true, naiveDimensions: true, stopInertiaOnNavigate: true })</script>
</body>
</html>
