<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste de recettes | CHOP</title>

    <link rel="stylesheet" href="https://unpkg.com/lenis@1.3.25/dist/lenis.css">
    <link rel="stylesheet" href="/style/global.css">
    <link rel="stylesheet" href="/style/add.css">
    <link rel="stylesheet" href="/style/dark-global.css">
    <link rel="stylesheet" href="/style/dark-add.css">
    <link rel="icon" type="image/png" href="/assets/logo/logo_fond_o.png">
</head>
<body>

    <div id="content">

        <div id="header">
            <div id="menu">
                <div id="logo">
                    <a href="/">
                        <img src="assets/logo/logo_rose.png" alt="Logo">
                    </a>
                </div>
                <div id="recherche">
                    <input type="text" id="recherche-input" placeholder="Rechercher">
                    <button id="recherche-btn">
                        <img src="assets/icones/loupe.svg" alt="🔍">
                    </button>
                </div>
                <div id="ajouter-btn">
                    <img src="assets/icones/plus.svg" alt="Nouvelle recette">
                </div>
            </div>
        </div>

        <div id="add-form">
            <h1>Ajouter une recette</h1>

            <h2>Informations</h2>

            <div class="text-input input">
                <p>Titre :</p>
                <input type="text">
            </div>
            <div class="text-input input">
                <p>Description :</p>
                <input type="text">
            </div>
            <div class="text-input input">
                <p>Auteur :</p>
                <input type="text">
            </div>
            <div class="text-input input">
                <p>Slug :</p>
                <input type="text">
            </div>
            <div class="img-input input">
                <p>Couverture :</p>
                <input type="file">
            </div>
            <div class="dropdown-input input">
                <p>Catégorie :</p>
                <select>
                    <option>Entrée</option>
                    <option>Plat</option>
                    <option>Dessert</option>
                    <option>Autre</option>
                </select>
            </div>
            <div class="dropdown-input input">
                <p>Difficulté :</p>
                <select>
                    <option>Facile</option>
                    <option>Moyen</option>
                    <option>Difficile</option>
                </select>
            </div>
            <div class="dropdown-input input">
                <p>Prix :</p>
                <select>
                    <option>€</option>
                    <option>€€</option>
                    <option>€€€</option>
                </select>
            </div>
            <div class="number-input input">
                <p>Temps de préparation :</p>
                <input type="number">
            </div>
            <div class="number-input input">
                <p>Temps de repos :</p>
                <input type="number">
            </div>
            <div class="number-input input">
                <p>Temps de cuisson :</p>
                <input type="number">
            </div>
            <div class="number-input input">
                <p>Portions :</p>
                <input type="number" placeholder="4">
                <input type="text" placeholder="personnes">
            </div>


            <h2>Ingrédients</h2>

           <div id="ingredients-liste">
               <div class="ingredient">
                   <img class="ingredient-photo" src="/assets/ingredients/basilic.png">
                   <input type="text" class="ingredient-nom">
                   <input type="number" class="ingredient-quantite">
                  <input type="text" class="ingredient-unite"> 
               </div>
               
               <div class="ingredient">
                   <img class="ingredient-photo" src="/assets/ingredients/basilic.png">
                   <input type="text" class="ingredient-nom">
                   <input type="number" class="ingredient-quantite">
                  <input type="text" class="ingredient-unite"> 
               </div>
    
               <div class="ingredient">
                   <img class="ingredient-photo" src="/assets/ingredients/basilic.png">
                   <input type="text" class="ingredient-nom">
                   <input type="number" class="ingredient-quantite">
                  <input type="text" class="ingredient-unite"> 
               </div>
           </div> 

            <div id="ajouter-ingredient">+</div>
            

            <h2>Étapes</h2>
            <div id="etapes-liste">
                <div class="etape">
                    <p class="etape-num">1</p>
                    <input type="text" class="etape-desc">
                    <button class="etape-suppr">X</button>
                </div>
                <div class="etape">
                    <p class="etape-num">2</p>
                    <input type="text" class="etape-desc">
                    <button class="etape-suppr">X</button>
                </div>
                <div class="etape">
                    <p class="etape-num">3</p>
                    <input type="text" class="etape-desc">
                    <button class="etape-suppr">X</button>
                </div>
            </div>
            
            <div id="ajouter-etape">+</div>
        
            <div id="ajouter-recette">Publier la recette</div>
        </div>



        <div id="footer">
            <p id="footer-gauche">&copy; C. Ruetsch</p>
            <div id="footer-centre">
                <img src="assets/logo/logo_blanc.png">
            </div>
            <div id="footer-droite">
                <p><a href="todo">ToDo</a> / <span id="darkmode">Dark Mode</span></p>
            </div>
        </div>

    </div>

    <script src="/script/add.js"></script>
    <script src="/script/darkmode.js"></script>

    <script src="https://unpkg.com/lenis@1.3.25/dist/lenis.min.js"></script> 
    <script>new Lenis({ autoRaf: true, autoToggle: true, anchors: true, allowNestedScroll: true, naiveDimensions: true, stopInertiaOnNavigate: true })</script>

</body>
</html>
