version: '3.8'
services:
  chop-container:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chop
    restart: unless-stopped
    networks:
      - web
    app:
      environment:
        - DB_PATH=/app/data/recipes.sqlite
      volumes:
        - /opt/docker-data/chop/db:/app/data
networks:
  web:
    external: true