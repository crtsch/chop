version: '3.8'
services:
  chop-container:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chop
    restart: unless-stopped
    environment:
      - DB_PATH=/app/data/recipes.sqlite
      - UPLOADS_PATH=/app/uploads
    volumes:
      - /opt/docker-data/chop/db:/app/data
      - /opt/docker-data/chop/uploads:/app/uploads
    networks:
      - web

networks:
  web:
    external: true